<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>TREINO</title>
<style>
  :root{
    --ink:#12151A; --panel:#1B2028; --panel2:#232A34; --line:#2E3742;
    --text:#EDF1F5; --dim:#8B98A5; --red:#FF4438; --steel:#7FB4C9;
    --green:#4FC98A; --amber:#F5B841;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --sans:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:84px}
  button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:1rem;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--steel);outline-offset:1px}

  /* ------- header ------- */
  header{padding:20px 18px 8px;display:flex;align-items:baseline;justify-content:space-between}
  .brand{font-weight:900;font-size:1.5rem;letter-spacing:.14em;text-transform:uppercase}
  .brand b{color:var(--red)}
  .hdate{font-family:var(--mono);font-size:.75rem;color:var(--dim)}
  .whopill{font-family:var(--mono);font-size:.72rem;color:var(--steel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px}
  .whopill:active{opacity:.6}
  .whorow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;text-align:left}
  .whorow.on{border-color:var(--red)}
  .whoname{font-weight:800;font-size:1rem}
  .pcard{display:flex;align-items:center;gap:14px;width:100%;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;text-align:left}
  .pcard.on{border-color:var(--red)}
  .pcard:active{opacity:.7}
  .pinit{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.25rem;color:var(--red)}
  .pcard.on .pinit{background:linear-gradient(160deg,#3a1512,#2a100e);border-color:var(--red)}

  /* ------- week stamp (signature) ------- */
  .stamp{margin:12px 18px 4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .stamp-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .stamp-label{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .stamp-count{font-family:var(--mono);font-size:.8rem;color:var(--dim)}
  .stamp-count b{color:var(--text);font-size:1.05rem}
  .plates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .plate{height:46px;border-radius:9px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.68rem;color:var(--dim);transition:all .35s ease}
  .plate.done{border:1.5px solid var(--red);background:linear-gradient(160deg,#3a1512,#2a100e);color:var(--red);font-weight:700;box-shadow:0 0 14px rgba(255,68,56,.18)}
  .plate.bonus{border-color:var(--amber);color:var(--amber);background:#2c230f}
  .stamp-mins{margin-top:12px}
  .minbar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
  .minbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--steel),var(--green));border-radius:4px;transition:width .4s ease}
  .minrow{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.7rem;color:var(--dim);margin-top:5px}

  /* ------- generic ------- */
  .wrap{padding:0 18px}
  h2.sec{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
  h2.sec::after{content:'';flex:1;height:1px;background:var(--line)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .row{display:flex;gap:10px}
  .grow{flex:1}
  .btn{display:block;width:100%;text-align:center;padding:14px;border-radius:10px;font-weight:800;font-size:.95rem;letter-spacing:.04em}
  .btn-red{background:var(--red);color:#fff}
  .btn-red:active{transform:scale(.98)}
  .btn-ghost{border:1px solid var(--line);color:var(--dim)}
  .btn-steel{background:var(--steel);color:#0d1418}
  .chip{display:inline-block;font-family:var(--mono);font-size:.66rem;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim)}
  .chip.red{border-color:var(--red);color:var(--red)}
  .chip.steel{border-color:var(--steel);color:var(--steel)}
  .chip.amber{border-color:var(--amber);color:var(--amber)}
  .chip.green{border-color:var(--green);color:var(--green)}

  /* ------- launcher cards ------- */
  .launch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .launch .card{margin:0;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
  .launch .t{font-weight:800;font-size:1rem;line-height:1.15}
  .launch .s{font-size:.72rem;color:var(--dim);margin-top:4px}
  .launch .mm{border-left:3px solid var(--red)}
  .launch .ab{border-left:3px solid var(--steel)}
  .launch .fr{border-left:3px solid var(--amber)}
  .launch .hi{border-left:3px solid var(--green)}

  /* ------- session logging ------- */
  .sess-head{display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px}
  .sess-title{font-weight:900;font-size:1.25rem;text-transform:uppercase;letter-spacing:.05em}
  .back{color:var(--steel);font-size:.85rem;font-weight:700;padding:8px 0}
  .ex{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:13px 14px;width:100%;text-align:left}
  .ex-name{font-weight:800;font-size:.95rem}
  .ex-meta{font-family:var(--mono);font-size:.66rem;color:var(--dim);margin-top:4px;line-height:1.7}
  .ex-body{padding:0 14px 14px;border-top:1px dashed var(--line);display:none}
  .ex.open .ex-body{display:block}
  .ex-note{font-size:.78rem;color:var(--dim);padding:10px 0 4px;line-height:1.45}
  .ex-sub{font-family:var(--mono);font-size:.66rem;color:var(--steel);padding-bottom:8px}
  .yt-link{display:inline-block;font-size:.72rem;color:var(--red);font-weight:700;text-decoration:none;padding:6px 0 8px}
  .yt-link:active{opacity:.6}
  .setgrid{display:grid;grid-template-columns:54px 1fr 1fr;gap:8px;align-items:center;margin-top:8px}
  .setlab{font-family:var(--mono);font-size:.7rem;color:var(--dim)}
  .setgrid input{padding:9px 10px;font-family:var(--mono);text-align:center}
  .lastvals{font-family:var(--mono);font-size:.64rem;color:var(--green);margin-top:6px}
  .tech{margin-top:8px;font-size:.72rem;color:var(--amber);font-family:var(--mono)}
  .donebox{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:transparent}
  .donebox.on{border-color:var(--green);background:#12291d;color:var(--green)}

  /* ------- abs day ------- */
  .abs-move{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
  .abs-move:last-child{border:none}
  .abs-reps{font-family:var(--mono);font-weight:700;color:var(--steel)}
  .lvlpick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
  .lvlpick button{border:1px solid var(--line);border-radius:9px;padding:10px 4px;font-family:var(--mono);font-size:.72rem;color:var(--dim)}
  .lvlpick button.on{border-color:var(--steel);color:var(--steel);background:#14222a}
  .daynav{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}
  .daynav button{font-size:1.4rem;color:var(--steel);padding:4px 16px}
  .daynum{font-weight:900;font-size:1.35rem}

  /* ------- history ------- */
  .hist{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
  .hist .d{font-family:var(--mono);font-size:.68rem;color:var(--dim)}
  .hist .t{font-weight:700;font-size:.9rem;margin-top:2px}
  .hist .m{font-family:var(--mono);font-size:.72rem;color:var(--steel)}
  .del{color:var(--dim);font-size:1.05rem;padding:6px 8px}
  .empty{text-align:center;color:var(--dim);font-size:.85rem;padding:30px 10px;line-height:1.6}

  /* ------- bottom tabs ------- */
  nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(18,21,26,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  nav button{padding:13px 0 11px;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
  nav button.on{color:var(--red)}
  nav button.on span{border-bottom:2px solid var(--red);padding-bottom:4px}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--green);color:#0d1a12;font-weight:800;font-size:.85rem;padding:11px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .weekpick{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .weekpick::-webkit-scrollbar{display:none}
  .weekpick button{flex-shrink:0;font-family:var(--mono);font-size:.72rem;padding:7px 13px;border:1px solid var(--line);border-radius:20px;color:var(--dim)}
  .weekpick button.on{border-color:var(--red);color:var(--red);background:#2a100e}
  .badge-deload{font-size:.68rem;color:var(--amber);font-family:var(--mono);margin-bottom:8px}
  .restrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
  .restrow::-webkit-scrollbar{display:none}
  .restrow button{flex-shrink:0;font-family:var(--mono);font-size:.74rem;padding:8px 13px;border:1px solid var(--line);border-radius:20px;color:var(--steel)}
  .rtimer{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-family:var(--mono);font-weight:800;font-size:1.05rem;padding:11px 24px;border-radius:30px;display:none;z-index:40;box-shadow:0 4px 20px rgba(255,68,56,.4)}
  .rtimer.on{display:block}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function ytUrl(name){
  if(YT[name]) return 'https://youtu.be/'+YT[name];

let tInt=null;
function restRow(){
  const opts=[[60,'1:00'],[90,'1:30'],[120,'2:00'],[180,'3:00'],[300,'5:00']];
  return `<div class="restrow">${opts.map(o=>`<button onclick="startTimer(${o[0]})">⏱ ${o[1]}</button>`).join('')}</div>`;
}
function startTimer(sec){
  clearInterval(tInt);
  const el=document.getElementById('rtimer');
  const end=Date.now()+sec*1000;
  el.classList.add('on');
  const tick=()=>{
    const r=Math.max(0,Math.round((end-Date.now())/1000));
    el.textContent='⏱ '+Math.floor(r/60)+':'+String(r%60).padStart(2,'0')+'   ✕';
    if(r<=0){ clearInterval(tInt); tInt=null; el.classList.remove('on'); buzz(); }
  };
  tick(); tInt=setInterval(tick,250);
}
function stopTimer(){ clearInterval(tInt); tInt=null; document.getElementById('rtimer').classList.remove('on'); }
function buzz(){
  if(navigator.vibrate) navigator.vibrate([300,150,300]);
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=880; g.gain.value=.25;
    o.start(); o.stop(ctx.currentTime+.6);
  }catch(e){}
  toast('Rest over — go! 🔔');
}

function localKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addDays(k,n){const [y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d);dt.setDate(dt.getDate()+n);return localKey(dt);}
/* next workout = the one after the last Min-Max you logged (never repeats, never skips) */
function nextInRotation(){
  const mm=S.sessions.filter(s=>s.kind==='mm');
  if(!mm.length) return ROT[0];
  const i=ROT.indexOf(mm[mm.length-1].mmDay);
  return ROT[(i+1)%ROT.length];
}
const moved=()=>S.state.moved||(S.state.moved=[]);
const skipped=()=>S.state.skipped||(S.state.skipped=[]);
function isSlot(k){ return (mySlots()[k]&&!skipped().includes(k)) || moved().includes(k); }
function slotNote(k){ return mySlots()[k] || 'extra day'; }
function nextSlotAfter(k){
  const all=new Set([...Object.keys(mySlots()),...moved()]);
  return [...all].filter(x=>x>k&&!skipped().includes(x)).sort()[0]||null;
}
/* push today's session to tomorrow (or any later day) */
async function moveToTomorrow(){
  const k=localKey(new Date()), t=addDays(k,1);
  if(mySlots()[k]&&!skipped().includes(k)) skipped().push(k);
  if(!moved().includes(t)) moved().push(t);
  const i=skipped().indexOf(t); if(i>-1) skipped().splice(i,1);
  await save(); toast('Moved to tomorrow ✓'); renderHome();
}
async function trainAnyway(){
  const k=localKey(new Date());
  if(!moved().includes(k)) moved().push(k);
  const i=skipped().indexOf(k); if(i>-1) skipped().splice(i,1);
  await save(); renderHome();
}

function suggestNext(){
  const done = S.sessions.filter(s=>s.kind==='mm').map(s=>s.mmDay);
  for(const d of MM_ORDER){
    const lastIdx = done.lastIndexOf(d);
    if(lastIdx===-1) return d;
  }
  // rotate: whatever was logged longest ago
  let best=MM_ORDER[0], bestIdx=Infinity;
  for(const d of MM_ORDER){ const i=done.lastIndexOf(d); if(i<bestIdx){bestIdx=i;best=d;} }
  return best;
}

    <h2 class="sec">Session</h2>
    <div class="card">
      <div class="row">
        <div class="grow"><label class="setlab">Duration (min)</label><input type="number" id="mins" inputmode="numeric" placeholder="75"></div>
        <div class="grow"><label class="setlab">Date</label><input type="date" id="sdate" value="${forDate||localKey(new Date())}"></div>
      </div>
      <div style="margin-top:10px"><label class="setlab">Notes</label><textarea id="snote" rows="2" placeholder="How did it go?"></textarea></div>
    </div>
    <button class="btn btn-red" onclick="saveMM()">Save session ✓</button>
    <div style="height:20px"></div>
  </div>`;
}
function setWeek(w,day){ S.state.week=w; save(); renderMM(day); }
function exCard(e,i,intro,techOn){
  const last=lastEntryFor(e.n);
  const lastStr = last? 'Last: '+last.sets.map(s=>(s.load||'–')+'×'+(s.reps||'–')).join(' · ') : '';
  const rir = intro? e.rir[0] : e.rir[1];
  return `<div class="ex" id="ex${i}">
    <button class="ex-head" onclick="toggleEx(${i})">
      <div>
        <div class="ex-name">${e.n}</div>
        <div class="ex-meta">${e.sets}×${e.reps} · RIR ${rir} · rest ${e.rest} · warm-up ${e.wu}</div>
        ${lastStr?`<div class="lastvals">${lastStr}</div>`:''}
      </div>
      <div class="donebox" id="db${i}" onclick="event.stopPropagation();toggleDone(${i})">✓</div>
    </button>
    <div class="ex-body">
      <div class="ex-note">${e.note}</div>
      <a class="yt-link" href="${ytUrl(e.n)}" target="_blank" rel="noopener">▶ Watch demo (Jeff Nippard)</a>
      ${e.sub?`<div class="ex-sub">Subs: ${e.sub}</div>`:''}
      ${techOn&&e.tech?`<div class="tech">🔥 Last set: ${e.tech}</div>`:''}
      ${draft.entries[i].sets.map((s,j)=>`
        <div class="setgrid">
          <div class="setlab">Set ${j+1}</div>
          <input inputmode="decimal" placeholder="load kg" oninput="draft.entries[${i}].sets[${j}].load=this.value">
          <input inputmode="numeric" placeholder="reps" oninput="draft.entries[${i}].sets[${j}].reps=this.value">
        </div>`).join('')}
    </div>
  </div>`;
}
function toggleEx(i){ document.getElementById('ex'+i).classList.toggle('open'); }
function toggleDone(i){ draft.entries[i].done=!draft.entries[i].done; document.getElementById('db'+i).classList.toggle('on',draft.entries[i].done); }
async function saveMM(){
  const mins=parseInt(document.getElementById('mins').value)||0;
  const date=document.getElementById('sdate').value||localKey(new Date());
  draft.mins=mins; draft.date=date; draft.notes=document.getElementById('snote').value||'';
  draft.id=Date.now();
  S.sessions.push(draft); S.sessions.sort((a,b)=>a.date<b.date?-1:1);
  await save(); toast('Session saved ✓'); go('home');
}

    <div class="lvlpick">
      ${[1,2,3].map(l=>`<button class="${l===lvl?'on':''}" onclick="absLvl(${l})">LVL ${'I'.repeat(l)}<br>${ABS_LVL[l]} sets</button>`).join('')}

function absDay(d){ S.state.absDay=Math.min(30,Math.max(1,S.state.absDay+d)); save(); renderAbs(); }
function absLvl(l){ S.state.absLvl=l; save(); renderAbs(); }
async function saveAbs(){
  const mins=parseInt(document.getElementById('mins').value)||10;
  const date=document.getElementById('sdate').value||localKey(new Date());
  S.sessions.push({id:Date.now(),kind:'abs',label:'Total Abs · Day '+S.state.absDay,short:'ABS',date,mins,entries:[]});
  S.sessions.sort((a,b)=>a.date<b.date?-1:1);
  S.state.absDay=Math.min(30,S.state.absDay+1);
  await save(); toast('Abs day saved ✓'); go('home');
}

}

/* ---------- WEEK VIEW ---------- */
function weekDayKeys(){
  const ws=weekStart(new Date()); const out=[];
  for(let i=0;i<7;i++){ const d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+i); out.push(localKey(d)); }
  return out;
}
/* project the rotation across this week's remaining slots */
function weekRows(){
  const usePlan=hasPlan();
  const days=weekDayKeys();
  const keys=usePlan? days.filter(k=>isSlot(k)) : days;
  let i=ROT.indexOf(nextInRotation());
  return keys.map(k=>{
    const done=S.sessions.find(s=>s.kind==='mm'&&s.date===k);
    if(done) return {k,day:done.mmDay,done:true,mins:done.mins||0};
    const day=ROT[((i%4)+4)%4]; i++;
    return {k,day,done:false};
  });
}
function renderWeekView(){
  const today=localKey(new Date());
  const rows=weekRows();
  const doneN=rows.filter(r=>r.done).length;
  const usePlan=hasPlan();
  V.innerHTML=`<div class="wrap">
    <h2 class="sec">This week</h2>
    <div style="font-family:var(--mono);font-size:.72rem;color:var(--dim);margin-bottom:12px">${doneN}/4 done · ${rows.length} day${rows.length===1?'':'s'} available · tap any to train</div>
    ${rows.length? rows.map(r=>{
      const isToday=r.k===today, past=r.k<today;
      return `<button class="whorow ${isToday?'on':''}" onclick="go('mm','${r.day}|${r.k}')" ${r.done?'style="opacity:.55"':''}>
        <div>
          <div class="d" style="font-family:var(--mono);font-size:.66rem;color:var(--dim)">${fmtD(r.k)}${isToday?' · TODAY':''}${usePlan&&mySlots()[r.k]?' · '+mySlots()[r.k].split('·')[0].trim():''}</div>
          <div class="whoname">${r.done?'✓ ':''}${MM[r.day].label}</div>
        </div>
        <span class="chip ${r.done?'green':isToday?'red':past?'':'steel'}">${r.done?r.mins+' min':past?'missed':isToday?'today':'planned'}</span>
      </button>`;
    }).join('') : '<div class="empty">No training days left this week.<br>Use <b>Train</b> to start a session anyway.</div>'}
    <div style="font-size:.7rem;color:var(--dim);margin-top:6px;line-height:1.5">Order follows the rotation — a session you skip moves down the list instead of being dropped.</div>
  </div>`;
}

/* ---------- PROFILES (fixed: two people) ---------- */
function personCard(id,sub){
  const p=PEOPLE.find(x=>x.id===id);
  return `<button class="pcard ${id===WHO?'on':''}" onclick="pickWho('${id}')">
    <div class="pinit">${p.name[0]}</div>
    <div style="flex:1">
      <div class="whoname">${p.name}</div>
      <div style="font-size:.72rem;color:var(--dim);margin-top:3px">${sub}</div>
    </div>
    ${id===WHO?'<span class="chip red">training now</span>':'<span class="chip steel">select</span>'}
  </button>`;
}
function subFor(id){
  const n=Object.keys(SLOTS[id]||{}).length;
  return n? n+' scheduled days · shift-based plan' : 'no fixed schedule · train any day';
}
function renderSetup(){
  const pill=document.getElementById('whopill'); if(pill) pill.style.display='none';
  V.innerHTML=`<div class="wrap">
    <h2 class="sec">Who's training?</h2>
    <div style="font-size:.82rem;color:var(--dim);line-height:1.5;margin-bottom:14px">Separate history, loads and progress for each of you. Pick once — the app remembers on this phone.</div>
    ${PEOPLE.map(p=>personCard(p.id,subFor(p.id))).join('')}
  </div>`;
}
async function pickWho(id){
  WHO=id; await saveProfiles();
  if(id==='eduardo') await migrate();
  await load();
  const pill=document.getElementById('whopill'); if(pill) pill.style.display='';
  paintPill(); go('home');
}
function paintPill(){
  const p=PEOPLE.find(x=>x.id===WHO);
  const el=document.getElementById('whopill');
  if(el) el.textContent='\u25cf '+(p?p.name:'—');
}
function renderWho(){
  V.innerHTML=`<div class="wrap">
    <button class="back" onclick="go('home')">\u2039 Back</button>
    <h2 class="sec">Who's training?</h2>
    ${PEOPLE.map(p=>personCard(p.id,subFor(p.id))).join('')}
    <div style="font-size:.7rem;color:var(--dim);margin-top:10px;line-height:1.5">Switching keeps both histories intact — nothing is shared between the two.</div>
  </div>`;
}

/* ---------- FREE SESSION ---------- */
function renderFree(){
  V.innerHTML=`<div class="wrap">
    <button class="back" onclick="go('log')">‹ Back</button>
    <div class="sess-head"><div class="sess-title">Free Session</div><span class="chip amber">Quick log</span></div>
    <div class="card">
      <label class="setlab">What did you do?</label>
      <input id="flabel" placeholder="Run · Home gym · Swim · Padel…" style="margin:6px 0 12px">
      <div class="row">
        <div class="grow"><label class="setlab">Duration (min)</label><input type="number" id="mins" inputmode="numeric" placeholder="45"></div>
        <div class="grow"><label class="setlab">Date</label><input type="date" id="sdate" value="${localKey(new Date())}"></div>
      </div>
      <div style="margin-top:12px"><label class="setlab">Notes</label><textarea id="snote" rows="2" placeholder="Optional"></textarea></div>

      </label>

    <button class="btn btn-red" onclick="saveFree()">Save session ✓</button>

}
async function saveFree(){
  const label=document.getElementById('flabel').value||'Free session';
  const mins=parseInt(document.getElementById('mins').value)||0;
  const date=document.getElementById('sdate').value||localKey(new Date());

/* ---------- HISTORY ---------- */
function histRow(s){
  const kindChip = s.kind==='mm'?'red':s.kind==='abs'?'steel':'amber';
  return `<div class="hist">
    <div>
      <div class="d">${fmtD(s.date)}${s.week?' · W'+s.week:''}</div>
      <div class="t">${esc(s.label)}</div>
    </div>
    <div style="text-align:right">
      <div class="m">${s.mins||0} min</div>
      <button class="del" onclick="delSess(${s.id})">✕</button>
    </div>
  </div>`;
}
function renderHist(){
  const total=S.sessions.reduce((a,s)=>a+(s.mins||0),0);
  V.innerHTML=`<div class="wrap">
    <h2 class="sec">History</h2>
    ${S.sessions.length?`<div style="font-family:var(--mono);font-size:.72rem;color:var(--dim);margin-bottom:12px">${S.sessions.length} sessions · ${total} min total</div>`:''}
    ${S.sessions.length? S.sessions.slice().reverse().map(histRow).join('') : '<div class="empty">No sessions yet.</div>'}
    <h2 class="sec">Backup</h2>
    <div class="card">
      <textarea id="bk" rows="3" placeholder="Tap Export to copy your data · paste a backup here and tap Import"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn btn-ghost grow" onclick="exportData()">Export</button>
        <button class="btn btn-steel grow" onclick="importData()">Import</button>
      </div>
      <div style="font-size:.68rem;color:var(--dim);margin-top:8px;line-height:1.5">Each copy of TREINO (chat artifact, home-screen version) keeps its own data. Export here → paste + Import in the other copy to merge. Duplicates are skipped automatically.</div>
    </div>
  </div>`;
}
async function exportData(){
  const j=JSON.stringify(S);
  document.getElementById('bk').value=j;
  try{ await navigator.clipboard.writeText(j); toast('Copied to clipboard ✓'); }
  catch(e){ toast('Select the text and copy manually'); }
}
async function importData(){
  try{
    const d=JSON.parse(document.getElementById('bk').value);
    if(!d.sessions) throw new Error('bad');
    const ids=new Set(S.sessions.map(s=>s.id));
    let added=0;
    d.sessions.forEach(s=>{ if(!ids.has(s.id)){ S.sessions.push(s); added++; } });
    S.sessions.sort((a,b)=>a.date<b.date?-1:1);
    if(d.state && d.state.absDay>=(S.state.absDay||1)) S.state=d.state;
    await save(); toast('Imported '+added+' session'+(added===1?'':'s')+' ✓'); renderHist();
  }catch(e){ toast('⚠ Invalid backup data'); }
}
async function delSess(id){
  if(!confirm('Delete this session?')) return;
  S.sessions=S.sessions.filter(s=>s.id!==id);
  await save(); (cur==='hist'?renderHist:renderHome)();
}

/* ---------- INIT ---------- */
(async ()=>{
  await loadProfiles();
  if(!WHO){ renderSetup(); return; }
  if(WHO==='eduardo') await migrate();
  await load();
  paintPill(); renderHome();
})();
</script>
